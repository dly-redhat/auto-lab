---
- name: Make sure the CMDB has fields for the CVE counts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create any missing custom CVE fields
      ansible.builtin.include_role:
        name: cmdb_sync
        tasks_from: fields

- name: Collect each host's CVE counts and record them in the ServiceNow CMDB
  hosts: demo_targets
  gather_facts: true
  roles:
    - role: security_facts
    - role: cmdb_sync
      vars:
        cmdb_sync_require_security: true
