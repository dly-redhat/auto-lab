---
- name: Require explicit opt-in and a supported demo target
  ansible.builtin.assert:
    that:
      - demo_drift_allowed is boolean
      - demo_drift_allowed
      - inventory_hostname in groups['demo_targets']
      - ansible_facts['distribution'] in ['RedHat', 'OracleLinux']
      - ansible_facts['distribution_major_version'] == '9'
      - demo_drift_control in ['console_login_banner', 'snmp_community']
    fail_msg: Drift injection is restricted to explicitly authorized RHEL/Oracle 9 demo targets.

- name: Seed the selected explicitly authorized control
  ansible.builtin.include_tasks: '{{ demo_drift_control }}.yml'
