---
- name: Require a reviewed revision and private API authentication
  ansible.builtin.assert:
    that:
      - aap_demo_revision is match('^[a-f0-9]{40}$')
      - aap_demo_url.startswith('https://')
      - aap_demo_token | length > 0
  no_log: true

- name: Create the isolated platform organization
  ansible.platform.organization:
    aap_hostname: '{{ aap_demo_url }}'
    aap_token: '{{ aap_demo_token }}'
    aap_validate_certs: true
    name: '{{ aap_demo_organization }}'
    description: Isolated RHEL policy-remediation demonstration
    state: present

- name: Create separate operator and approver teams
  ansible.platform.team:
    aap_hostname: '{{ aap_demo_url }}'
    aap_token: '{{ aap_demo_token }}'
    aap_validate_certs: true
    name: '{{ item }}'
    organization: '{{ aap_demo_organization }}'
    state: present
  loop: ['{{ aap_demo_operator_team }}', '{{ aap_demo_approver_team }}']

- name: Select the exact externally validated execution environment
  ansible.controller.execution_environment:
    name: '{{ aap_demo_ee_name }}'
    organization: '{{ aap_demo_organization }}'
    image: '{{ aap_demo_ee_image }}'
    pull: never
    state: present

- name: Configure the Git-backed project at the reviewed commit
  ansible.controller.project:
    name: '{{ aap_demo_project }}'
    organization: '{{ aap_demo_organization }}'
    scm_type: git
    scm_url: '{{ aap_demo_repository }}'
    scm_branch: '{{ aap_demo_revision }}'
    scm_clean: true
    scm_update_on_launch: false
    allow_override: false
    default_environment: '{{ aap_demo_ee_name }}'
    update_project: true
    wait: true
    timeout: 300
    state: present

- name: Create the demo inventory
  ansible.controller.inventory:
    name: '{{ aap_demo_inventory }}'
    organization: '{{ aap_demo_organization }}'
    state: present

- name: Import groups and policy variables from the same Git project
  ansible.controller.inventory_source:
    name: '{{ aap_demo_inventory_source }}'
    inventory: '{{ aap_demo_inventory }}'
    organization: '{{ aap_demo_organization }}'
    source: scm
    source_project: '{{ aap_demo_project }}'
    source_path: inventories/lab/hosts.yml
    execution_environment: '{{ aap_demo_ee_name }}'
    overwrite: true
    overwrite_vars: true
    update_on_launch: false
    state: present

- name: Synchronize the reviewed inventory
  ansible.controller.inventory_source_update:
    name: '{{ aap_demo_inventory_source }}'
    inventory: '{{ aap_demo_inventory }}'
    organization: '{{ aap_demo_organization }}'
    wait: true
    timeout: 300

- name: Store the existing fleet key in a Controller machine credential
  ansible.controller.credential:
    name: '{{ aap_demo_machine_credential }}'
    organization: '{{ aap_demo_organization }}'
    credential_type: Machine
    inputs:
      username: '{{ aap_demo_machine_user }}'
      ssh_key_data: '{{ lookup("ansible.builtin.file", aap_demo_machine_key_file) }}'
      become_method: sudo
      become_username: root
    update_secrets: false
    state: present
  no_log: true

- name: Define per-job verified SSH host trust injection
  ansible.controller.credential_type:
    name: '{{ aap_demo_trust_type }}'
    kind: cloud
    inputs:
      fields:
        - id: known_hosts
          label: Verified guest public host keys
          type: string
          multiline: true
      required: [known_hosts]
    injectors:
      file:
        template: "{{ '{{ known_hosts }}' }}"
      extra_vars:
        ansible_host_key_checking: 'true'
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ '{{ tower.filename }}' }}
    state: present

- name: Store console-verified guest keys without changing global Controller settings
  ansible.controller.credential:
    name: '{{ aap_demo_trust_credential }}'
    organization: '{{ aap_demo_organization }}'
    credential_type: '{{ aap_demo_trust_type }}'
    inputs:
      known_hosts: '{{ lookup("ansible.builtin.file", aap_demo_known_hosts_file) }}'
    state: present

- name: Create constrained job templates
  ansible.controller.job_template:
    name: '{{ item.name }}'
    organization: '{{ aap_demo_organization }}'
    project: '{{ aap_demo_project }}'
    inventory: '{{ aap_demo_inventory }}'
    execution_environment: '{{ aap_demo_ee_name }}'
    credentials: ['{{ aap_demo_machine_credential }}', '{{ aap_demo_trust_credential }}']
    playbook: '{{ item.playbook }}'
    limit: '{{ item.limit }}'
    job_type: run
    forks: 3
    timeout: 300
    allow_simultaneous: false
    become_enabled: false
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    ask_scm_branch_on_launch: false
    ask_limit_on_launch: false
    ask_variables_on_launch: '{{ item.ask_variables_on_launch | default(false) }}'
    extra_vars: '{{ item.extra_vars | default({}) }}'
    survey_enabled: '{{ item.survey_enabled | default(false) }}'
    survey_spec: '{{ item.survey_spec | default(omit) }}'
    state: present
  loop: '{{ aap_demo_jobs }}'
  loop_control:
    label: '{{ item.name }}'
  register: aap_demo_job_templates

- name: Create the approved remediation and read-only audit workflows
  ansible.controller.workflow_job_template:
    name: '{{ item }}'
    organization: '{{ aap_demo_organization }}'
    inventory: '{{ aap_demo_inventory }}'
    allow_simultaneous: false
    ask_variables_on_launch: false
    ask_inventory_on_launch: false
    ask_limit_on_launch: false
    ask_scm_branch_on_launch: false
    state: present
  loop: ['{{ aap_demo_workflow_remediate }}', '{{ aap_demo_workflow_audit }}']
  register: aap_demo_workflows

- name: Configure sequential workflow nodes and their success-only edges
  ansible.builtin.import_tasks: workflows.yml

- name: Grant operators execution of the two constrained workflows
  ansible.controller.role_team_assignment:
    team: '{{ aap_demo_operator_team }}'
    role_definition: WorkflowJobTemplate Execute
    object_id: '{{ item.id }}'
    state: present
  loop: '{{ aap_demo_workflows.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Grant operators the readiness and audit job templates only
  ansible.controller.role_team_assignment:
    team: '{{ aap_demo_operator_team }}'
    role_definition: JobTemplate Execute
    object_id: '{{ item.id }}'
    state: present
  loop: '{{ aap_demo_job_templates.results[:2] }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Grant approvers approval of the remediation workflow
  ansible.controller.role_team_assignment:
    team: '{{ aap_demo_approver_team }}'
    role_definition: WorkflowJobTemplate Approve
    object_id: '{{ aap_demo_workflows.results[0].id }}'
    state: present

- name: Prepare a disabled daily audit schedule for the demo
  ansible.controller.schedule:
    name: Auto Lab | Daily drift audit - disabled
    unified_job_template: '{{ aap_demo_workflow_audit }}'
    organization: '{{ aap_demo_organization }}'
    rrule: '{{ aap_demo_schedule_rule }}'
    enabled: false
    state: present
